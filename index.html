<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic-Tac-Toe</title>
    <style>
      :root {
        --bg1: #0f172a;
        --bg2: #1e293b;
        --panel: rgba(15, 23, 42, 0.8);
        --primary: #7c3aed;
        --secondary: #22c55e;
        --text: #e2e8f0;
        --x: #38bdf8;
        --o: #fbbf24;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, var(--bg1), var(--bg2));
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      .game-shell {
        width: min(92vw, 420px);
        background: var(--panel);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 18px;
        padding: 24px 20px 20px;
        box-shadow: 0 22px 60px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin: 0 0 8px;
        text-align: center;
        font-size: clamp(2rem, 5vw, 2.6rem);
      }

      .status {
        text-align: center;
        min-height: 28px;
        margin-bottom: 18px;
        font-size: 1.05rem;
        font-weight: 700;
      }

      .board {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-bottom: 18px;
      }

      .cell {
        width: 100%;
        aspect-ratio: 1;
        font-size: clamp(2.2rem, 7vw, 3.5rem);
        font-weight: 700;
        border: 0;
        border-radius: 12px;
        background: rgba(203, 213, 225, 0.12);
        color: var(--text);
        cursor: pointer;
        transition: transform 0.15s ease, background 0.15s ease;
      }

      .cell:hover {
        transform: translateY(-2px);
        background: rgba(203, 213, 225, 0.18);
      }

      .cell.x { color: var(--x); }
      .cell.o { color: var(--o); }

      .scoreboard {
        display: flex;
        justify-content: space-between;
        font-size: 0.95rem;
        margin-bottom: 16px;
        color: var(--text);
      }

      .score-box {
        background: rgba(255, 255, 255, 0.06);
        border-radius: 10px;
        padding: 8px 12px;
        flex: 1;
        text-align: center;
      }

      .controls {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-top: 10px;
      }

      .btn {
        flex: 1;
        border: 0;
        border-radius: 10px;
        padding: 12px 14px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        background: var(--primary);
        color: white;
      }

      .btn.secondary {
        background: var(--secondary);
      }
    </style>
  </head>
  <body>
    <div class="game-shell">
      <h1>Tic-Tac-Toe</h1>

      <div class="scoreboard">
        <div class="score-box">X: <span id="scoreX">0</span></div>
        <div class="score-box">O: <span id="scoreO">0</span></div>
        <div class="score-box">Draws: <span id="scoreDraw">0</span></div>
      </div>

      <div id="status" class="status">Player X's turn</div>

      <div class="board" id="board" aria-label="Tic Tac Toe Board">
        <button class="cell" data-index="0" aria-label="Cell 1"></button>
        <button class="cell" data-index="1" aria-label="Cell 2"></button>
        <button class="cell" data-index="2" aria-label="Cell 3"></button>
        <button class="cell" data-index="3" aria-label="Cell 4"></button>
        <button class="cell" data-index="4" aria-label="Cell 5"></button>
        <button class="cell" data-index="5" aria-label="Cell 6"></button>
        <button class="cell" data-index="6" aria-label="Cell 7"></button>
        <button class="cell" data-index="7" aria-label="Cell 8"></button>
        <button class="cell" data-index="8" aria-label="Cell 9"></button>
      </div>

      <div class="controls">
        <button class="btn secondary" id="resetBoard">Reset Board</button>
        <button class="btn" id="resetScores">Reset Scores</button>
      </div>
    </div>

    <script>
      const boardCells = [...document.querySelectorAll('.cell')];
      const statusEl = document.getElementById('status');
      const scoreXEl = document.getElementById('scoreX');
      const scoreOEl = document.getElementById('scoreO');
      const scoreDrawEl = document.getElementById('scoreDraw');

      let board = Array(9).fill('');
      let currentPlayer = 'X';
      let gameActive = true;
      let scores = { X: 0, O: 0, draw: 0 };

      const winningPatterns = [
        [0, 1, 2], [3, 4, 5], [6, 7, 8],
        [0, 3, 6], [1, 4, 7], [2, 5, 8],
        [0, 4, 8], [2, 4, 6]
      ];

      function updateScores() {
        scoreXEl.textContent = scores.X;
        scoreOEl.textContent = scores.O;
        scoreDrawEl.textContent = scores.draw;
      }

      function renderBoard() {
        boardCells.forEach((cell) => {
          const index = Number(cell.dataset.index);
          const value = board[index];
          cell.textContent = value;
          cell.classList.toggle('x', value === 'X');
          cell.classList.toggle('o', value === 'O');
          cell.disabled = !gameActive || value !== '';
        });
      }

      function setStatus(message) {
        statusEl.textContent = message;
      }

      function checkWinner() {
        for (const pattern of winningPatterns) {
          const [a, b, c] = pattern;
          if (board[a] && board[a] === board[b] && board[a] === board[c]) {
            return board[a];
          }
        }

        if (board.every((cell) => cell !== '')) {
          return 'draw';
        }

        return null;
      }

      function handleMove(index) {
        if (!gameActive || board[index] !== '') return;

        board[index] = currentPlayer;
        renderBoard();

        const result = checkWinner();

        if (result === 'draw') {
          scores.draw += 1;
          updateScores();
          setStatus("It's a draw! 😐");
          gameActive = false;
          return;
        }

        if (result) {
          scores[result] += 1;
          updateScores();
          setStatus(`Player ${result} wins! 🎉`);
          gameActive = false;
          return;
        }

        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        setStatus(`Player ${currentPlayer}'s turn`);
      }

      function resetBoard() {
        board = Array(9).fill('');
        currentPlayer = 'X';
        gameActive = true;
        setStatus("Player X's turn");
        renderBoard();
      }

      function resetScores() {
        scores = { X: 0, O: 0, draw: 0 };
        updateScores();
        resetBoard();
      }

      boardCells.forEach((cell) => {
        cell.addEventListener('click', () => {
          handleMove(Number(cell.dataset.index));
        });
      });

      document.getElementById('resetBoard').addEventListener('click', resetBoard);
      document.getElementById('resetScores').addEventListener('click', resetScores);

      updateScores();
      renderBoard();
    </script>
  </body>
</html>
